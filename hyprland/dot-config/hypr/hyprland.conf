# #######################################################################################
# HYPRLAND CONFIG - TRANSLATED FROM NIRI
# #######################################################################################
#
# This config has been translated from niri/config.kdl to hyprland format.
# Some niri-specific features don't have direct hyprland equivalents:
#   - Column-based layout → Hyprland uses dwindle/master layouts
#   - consume/expel-window → Mapped to group operations
#   - Preset column widths → Approximated with resize operations
#   - Tab indicators → Mapped to group visuals
#
# Refer to the wiki for more information:
# https://wiki.hypr.land/Configuring/
#
# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Translated from niri config:
# HDMI-A-1: position x=1920 y=0, scale 1.0
# eDP-1: position x=0 y=720, scale 1.5
monitor=HDMI-A-1,preferred,1920x0,1.0
monitor=eDP-1,preferred,0x720,1.5
monitor=,preferred,auto,auto  # Fallback for other monitors


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = vicinae


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Translated from niri's startup approach

# Start service manager (from niri config which starts runsvdir for services)

# Scratchpad applications
exec-once = [workspace special:term silent] kitty --class scratchpad-term
exec-once = [workspace special:notes silent] kitty --class scratchpad-notes -e nvim ~/now

# Common autostart items you might want:
exec-once = waybar
exec-once = vicinae server
exec-once = mako  # Notification daemon
# exec-once = hyprpaper  # Wallpaper daemon


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,12
env = ELECTRON_OZONE_PLATFORM_HINT,auto  # From niri config


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# plugin {
#     hyprexpo {
#         columns = 3
#         gap_size = 5
#         bg_col = rgb(111111)
#         workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1
#         gesture_distance = 300 # how far is the "max" for the gesture
#     }
# }


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4  

    gaps_out = 8  

    border_size = 2 

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Matching niri's active gradient: from white to hsl(150 50% 50% / 90%)
    col.active_border = rgba(ffffffff) rgba(40bf7fcc) 180deg
    col.inactive_border = rgba(00000033)  # Matching niri's inactive-color #0003

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 16
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true  
        range = 8  
        render_power = 3
        offset = 8 16  # Matching niri's offset x=8 y=16
        color = rgba(00000088)  # Matching niri's color "0008"
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# Translated from niri's animation config
animations {
    enabled = yes

    bezier = easeOutExpo,    0.16, 1,    0.3,  1  # For window-open
    bezier = easeOutQuad,    0.25, 0.46, 0.45, 0.94  # For window-close
    
    # Animations matching niri's config
    # workspace-switch: off in niri
    animation = workspaces, 0
    
    animation = windowsIn, 1, 2, easeOutExpo, popin 90%
    animation = windowsOut, 1, 2, easeOutQuad, popin 90%
    
    animation = windows, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = layers, 1, 4, default
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = eu
    kb_variant =
    kb_model =
    kb_rules =
    # For laptop: kb_options = ctrl:nocaps,altwin:swap_lalt_lwin
    # For desktop: kb_options = ctrl:nocaps
    # kb_options = ctrl:nocaps
    kb_options = ctrl:nocaps,altwin:swap_lalt_lwin
    follow_mouse = 0
    numlock_by_default = true

    sensitivity = 0.2 # Matching niri's accel-speed
    natural_scroll = true  # Matching niri's natural-scroll

    touchpad {
        natural_scroll = true  # Matching niri's natural-scroll
        tap-to-click = true  # Matching niri's tap
        disable_while_typing = true  # Matching niri's dwt
        scroll_factor = 1.0
    }
}

# Mouse configuration (matching niri)
device {
    name = epic-mouse-v1
    sensitivity = 0.2
    accel_profile = flat
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Window rules from niri config

# Floating windows
windowrulev2 = float, class:^(dmenu)$
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(1Password)$
windowrulev2 = float, class:^(waypaper)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(NautilusPreviewer)$

# Window sizes (approximating niri's default-column-width rules)
windowrulev2 = size 960 800, class:^(float\.md)$
windowrulev2 = size 960 800, class:^(1Password)$
windowrulev2 = size 960 800, class:^(waypaper)$
windowrulev2 = size 960 800, class:^(pavucontrol)$
windowrulev2 = size 600 600, class:^(float\.sm)$
windowrulev2 = size 1200 960, class:^(float\.lg)$
windowrulev2 = size 1200 960, class:^(NautilusPreviewer)$

# Privacy: block from screen capture (niri's block-out-from)
windowrulev2 = suppressevent screenrecord, class:^(1Password)$
windowrulev2 = suppressevent screenrecord, class:^(chrome-app\.fastmail)$
windowrulev2 = suppressevent screenrecord, title:^(Discord)$
windowrulev2 = suppressevent screenrecord, title:^(Cinny)$
windowrulev2 = suppressevent screenrecord, title:^(WhatsApp Web)$
windowrulev2 = suppressevent screenrecord, title:^(Microsoft Teams)$

# Rounded corners for all windows (from niri's geometry-corner-radius)
windowrulev2 = rounding 4, class:.*

# Scratchpad window rules
windowrulev2 = float, class:^(scratchpad-term)$
windowrulev2 = size 1600 900, class:^(scratchpad-term)$
windowrulev2 = center, class:^(scratchpad-term)$
windowrulev2 = workspace special:term, class:^(scratchpad-term)$

windowrulev2 = float, class:^(scratchpad-notes)$
windowrulev2 = size 1400 1000, class:^(scratchpad-notes)$
windowrulev2 = center, class:^(scratchpad-notes)$
windowrulev2 = workspace special:notes, class:^(scratchpad-notes)$

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

###################
### APPLICATION LAUNCHERS ###
###################

# Core applications
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, vicinae toggle
bind = $mainMod CTRL, Space, exec, vicinae vicinae://extensions/vicinae/core/search-emojis
bind = $mainMod, D, exec, nox-menu
# bind = $mainMod, X, exec, nox-menu  # Duplicate of Mod+D
bind = $mainMod, Comma, exec, kitty -d ~/dotfiles -e nvim "+FzfLua files"

# Browser and common apps
bind = $mainMod CTRL, B, exec, niri-focus-or-spawn Brave
bind = $mainMod, E, exec, sh -c 'tm-list-projects | fuzzel --dmenu | xargs kitty -d'

# File managers
bind = $mainMod CTRL, Y, exec, kitty yazi

# Utilities and apps
bind = ALT, Tab, exec, nox-menu niri-window-search
bind = $mainMod ALT, C, exec, clipboard-history
bind = $mainMod ALT, Comma, exec, niri-focus-or-spawn DevDocs
bind = $mainMod, Backslash, exec, 1password
bind = $mainMod, Slash, exec, 1password
bind = $mainMod, Semicolon, exec, kitten quick-access-terminal
bind = $mainMod CTRL, Comma, exec, obsidian
bind = $mainMod CTRL, D, exec, kitty lazydocker
bind = $mainMod CTRL, T, exec, niri-focus-or-spawn Teams
bind = $mainMod CTRL, W, exec, niri-focus-or-spawn whatsapp
bind = $mainMod, Delete, exec, makoctl dismiss --all
bind = $mainMod Mod5, C, exec, vicinae vicinae://extensions/vicinae/clipboard/history

# Scratchpads
bind = $mainMod, Grave, togglespecialworkspace, term
bind = $mainMod SHIFT, Grave, movetoworkspace, special:term
bind = $mainMod SHIFT, N, exec, kitty -1 -e vim ~/now
bind = $mainMod CTRL SHIFT, N, movetoworkspace, special:notes

# Notes
bind = $mainMod, N, exec, nox-menu notes
bind = $mainMod CTRL, N, exec, nox-menu notes '!!'

###################
### WINDOW MANAGEMENT ###
###################

# Close window
bind = $mainMod, Q, killactive

# Focus with vim keys (in niri: focus-column/focus-window-or-workspace)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows with vim keys (in niri: move-column/move-window)
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

###################
### MONITOR MANAGEMENT ###
###################

# Focus monitor with vim keys
bind = $mainMod SHIFT, H, focusmonitor, l
bind = $mainMod SHIFT, L, focusmonitor, r
bind = $mainMod SHIFT, K, focusmonitor, u
bind = $mainMod SHIFT, J, focusmonitor, d

# Move window to monitor with vim keys
bind = $mainMod SHIFT CTRL, H, movewindow, mon:l
bind = $mainMod SHIFT CTRL, L, movewindow, mon:r
bind = $mainMod SHIFT CTRL, K, movewindow, mon:u
bind = $mainMod SHIFT CTRL, J, movewindow, mon:d

###################
### WINDOW MANIPULATION ###
###################

# Fullscreen and floating
bind = $mainMod, F, fullscreen, 1  
bind = $mainMod SHIFT, F, fullscreen, 0  
bind = $mainMod CTRL, F, fullscreenstate, 0 2  

bind = $mainMod, V, togglefloating
bind = $mainMod, V, centerwindow

bind = $mainMod, M, exec, sh -c 'hyprctl dispatch resizeactive exact 1536 1080 && hyprctl dispatch centerwindow'
bind = $mainMod, C, centerwindow

# Resize window (niri: set-column-width/set-window-height)
bind = $mainMod, Minus, resizeactive, -10% 0
bind = $mainMod, Equal, resizeactive, 10% 0
bind = $mainMod SHIFT, Minus, resizeactive, 0 -10%
bind = $mainMod SHIFT, Equal, resizeactive, 0 10%

# Tiling control
bind = $mainMod, R, layoutmsg, togglesplit  # Toggle split orientation (approximates niri: switch-preset-column-width)

# Groups/Tabs (Hyprland equivalent of niri's columns)
# In niri: Mod+W toggles tabbed display, Mod+Comma/Period consume/expel
bind = $mainMod, W, togglegroup
bind = $mainMod, Comma, changegroupactive, b  # In niri: consume-window-into-column
bind = $mainMod, Period, changegroupactive, f  # In niri: expel-window-from-column
bind = $mainMod, BracketLeft, moveintogroup, l  # In niri: consume-or-expel-window-left
bind = $mainMod, BracketRight, moveintogroup, r  # In niri: consume-or-expel-window-right

# Overview and special modes
# bind = $mainMod, O, overview:toggle  # Requires hyprexpo plugin - uncomment if installed
bind = $mainMod, P, pseudo  # Pseudo-tiling (approximates niri: set-dynamic-cast-window)
bind = $mainMod CTRL, P, fullscreenstate, -1 2  # Fake fullscreen (niri: toggle-windowed-fullscreen)

###################
### WORKSPACE MANAGEMENT ###
###################

# Switch workspaces (offset by 1 to match niri: Mod+1 = workspace 2, etc.)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Workspace navigation
bind = $mainMod, Tab, workspace, previous  # In niri: focus-workspace-previous

# Move window to workspace (offset by 1 to match niri)
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

###################
### SCREENSHOTS ###
###################

bind = $mainMod SHIFT, 4, exec, grimblast copy area
bind = $mainMod SHIFT, 5, exec, grimblast copy screen
bind = , Print, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast copy screen
bind = ALT, Print, exec, grimblast copy active

###################
### SCREENSHARING ###
###################

# Mirror output (niri screensharing utils)
bind = $mainMod SHIFT, P, exec, sh -c 'wl-mirror $(hyprctl -j monitors | jq -r ".[] | select(.focused == true) | .name")'

###################
### MEDIA KEYS ###
###################

# Volume control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control
bindel = , XF86MonBrightnessUp, exec, brightnessctl --device=amdgpu_bl1 set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --device=amdgpu_bl1 set 10%-
bind = $mainMod, F8, exec, brightnessctl --device=amdgpu_bl1 set 10%
bind = $mainMod, F9, exec, brightnessctl --device=amdgpu_bl1 set 50%

# Media control
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

###################
### POWER MANAGEMENT ###
###################

# Lock screen
bind = $mainMod SHIFT, Delete, exec, swaylock -f

# Power off monitors
bind = $mainMod SHIFT, Escape, exec, hyprctl dispatch dpms off

###################
### SYSTEM ###
###################

# Exit
bind = $mainMod SHIFT, E, exit
bind = CTRL ALT, Delete, exit

###################
### MOUSE BINDINGS ###
###################

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Mouse wheel scrolling to navigate (niri-style)
bind = $mainMod SHIFT, mouse_down, movefocus, r
bind = $mainMod SHIFT, mouse_up, movefocus, l
bind = $mainMod CTRL SHIFT, mouse_down, movewindow, r
bind = $mainMod CTRL SHIFT, mouse_up, movewindow, l
