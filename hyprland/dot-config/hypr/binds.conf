###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER 

###################
### APPLICATION LAUNCHERS ###
###################

# core

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, vicinae toggle
bind = $mainMod CTRL, Space, exec, vicinae vicinae://extensions/vicinae/core/search-emojis
bind = $mainMod, Comma, exec, kitty -d ~/dotfiles -e nvim "+FzfLua files"

# Utilities and apps{{{

# Browser and common apps
bind = $mainMod CTRL, B, exec, niri-focus-or-spawn Brave
bind = $mainMod, E, exec, sh -c 'tm-list-projects | fuzzel --dmenu | xargs kitty -d'

# File managers
bind = $mainMod CTRL, Y, exec, kitty yazi
bind = ALT, Tab, exec, nox-menu niri-window-search
bind = $mainMod, D, exec, ~/.local/bin/nox-menu
bind = $mainMod ALT, Comma, exec, niri-focus-or-spawn DevDocs
bind = $mainMod, Slash, exec, 1password
bind = $mainMod CTRL, Comma, exec, obsidian
bind = $mainMod CTRL, D, exec, kitty lazydocker
bind = $mainMod CTRL, T, exec, niri-focus-or-spawn Teams
bind = $mainMod CTRL, W, exec, niri-focus-or-spawn whatsapp
bind = $mainMod, Delete, exec, makoctl dismiss --all
bind = $mainMod ALT, C, exec, vicinae vicinae://extensions/vicinae/clipboard/history
# bind = $mainMod ALT, C, exec, zsh -c clipboard-history

# }}}
# Scratchpads{{{

bind = $mainMod, Grave, togglespecialworkspace, term
bind = $mainMod, Semicolon, togglespecialworkspace, term
bind = $mainMod CTRL, Grave, movetoworkspace, special:term

bind = $mainMod, Period, togglespecialworkspace, notes
bind = $mainMod CTRL, Period, movetoworkspace, special:notes

# }}}

# Notes{{{

bind = $mainMod, N, exec, ~/.local/bin/nox-menu notes 
bind = $mainMod SHIFT, N, exec, kitty -1 -e vim ~/now
bind = $mainMod CTRL, N, exec, ~/.local/bin/nox-menu notes '!!'

# }}}
### WINDOW MANAGEMENT {{{

# Close window
bind = $mainMod, Q, killactive

# Focus with vim keys (in niri: focus-column/focus-window-or-workspace)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows with vim keys (in niri: move-column/move-window)
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

bind = $mainMod, O, submap, launch_submap

submap = launch_submap
bind = , H, layoutmsg, preselect l
bind = , H, submap, reset
bind = , L, layoutmsg, preselect r
bind = , L, submap, reset
bind = , J, layoutmsg, preselect b
bind = , J, submap, reset
bind = , K, layoutmsg, preselect u
bind = , K, submap, reset
bind = , X, layoutmsg, swapsplit
bind = , X, submap, reset
bind = , escape, submap, reset
submap = reset

###################
### MONITOR MANAGEMENT ###
###################

# Focus monitor with vim keys
bind = $mainMod SHIFT, H, focusmonitor, l
bind = $mainMod SHIFT, L, focusmonitor, r
bind = $mainMod SHIFT, K, focusmonitor, u
bind = $mainMod SHIFT, J, focusmonitor, d

# Move window to monitor with vim keys
bind = $mainMod SHIFT CTRL, H, movewindow, mon:l
bind = $mainMod SHIFT CTRL, L, movewindow, mon:r
bind = $mainMod SHIFT CTRL, K, movewindow, mon:u
bind = $mainMod SHIFT CTRL, J, movewindow, mon:d

###################
### WINDOW MANIPULATION ###
###################

# Fullscreen and floating
bind = $mainMod, F, fullscreen, 1  
bind = $mainMod SHIFT, F, fullscreenstate, 3
bind = $mainMod CTRL, F, fullscreenstate, -1 2  

bind = $mainMod, C, centerwindow

bind = $mainMod, V, togglefloating
bind = $mainMod, V, centerwindow

bind = $mainMod, M, setfloating
bind = $mainMod, M, resizeactive, exact 1536 1080
bind = $mainMod, M, centerwindow

# Resize window 
bind = $mainMod, Minus, resizeactive, -11% 0
bind = $mainMod, Equal, resizeactive, 11% 0
bind = $mainMod SHIFT, Minus, resizeactive, 0 -11%
bind = $mainMod SHIFT, Equal, resizeactive, 0 11%

# Tiling control
bind = $mainMod, R, layoutmsg, togglesplit  
bind = $mainMod CTRL, R, layoutmsg, resetpreset  

# Groups/Tabs 
bind = $mainMod, W, togglegroup
bind = $mainMod CTRL, W, moveoutofgroup
bind = $mainMod CTRL, BracketLeft, moveintogroup, l  
bind = $mainMod CTRL, BracketRight, moveintogroup, r 
bind = $mainMod, BracketLeft, changegroupactive, b
bind = $mainMod, BracketRight, changegroupactive, f

# Overview and special modes
# bind = $mainMod, O, overview:toggle  # Requires hyprexpo plugin - uncomment when installed
bind = $mainMod, P, pseudo  # Pseudo-tiling 
bind = $mainMod CTRL, P, fullscreenstate, -1 2  # Fake fullscreen 

###################
### WORKSPACE MANAGEMENT ###
###################

# Switch workspaces (offset by 1 to match niri: Mod+1 = workspace 2, etc.)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

# Workspace navigation
bind = $mainMod, Tab, workspace, previous  # In niri: focus-workspace-previous

# Move window to workspace (offset by 1 to match niri)
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# }}}
### SCREENSHOTS ###{{{

bind = $mainMod SHIFT, 4, exec, GRIMBLAST_EDITOR="gradia" grimblast edit area
bind = $mainMod SHIFT, 5, exec, GRIMBLAST_EDITOR="gradia" grimblast edit screen
bind = , Print, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast copy screen
bind = ALT, Print, exec, grimblast copy active
# }}}
### SCREENSHARING ###{{{
###################

# Mirror output (niri screensharing utils)
bind = $mainMod SHIFT, P, exec, sh -c 'wl-mirror $(hyprctl -j monitors | jq -r ".[] | select(.focused == true) | .name")'
# }}}
### MEDIA KEYS {{{

# Volume control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control
bindel = , XF86MonBrightnessUp, exec, brightnessctl --device=amdgpu_bl1 set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --device=amdgpu_bl1 set 10%-
bind = $mainMod, F8, exec, brightnessctl --device=amdgpu_bl1 set 10%
bind = $mainMod, F9, exec, brightnessctl --device=amdgpu_bl1 set 50%

# Media control
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
# }}}
### POWER MANAGEMENT{{{

# Lock screen
bind = $mainMod SHIFT, Delete, exec, swaylock -f

# Power off monitors
bind = $mainMod SHIFT, Escape, exec, hyprctl dispatch dpms off
# }}}
### SYSTEM {{{

# Exit
bind = $mainMod SHIFT, E, exit
bind = CTRL ALT, Delete, exit
# }}}
### MOUSE BINDINGS {{{

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Mouse wheel scrolling to navigate (niri-style)
bind = $mainMod SHIFT, mouse_down, movefocus, r
bind = $mainMod SHIFT, mouse_up, movefocus, l
bind = $mainMod CTRL SHIFT, mouse_down, movewindow, r
bind = $mainMod CTRL SHIFT, mouse_up, movewindow, l
# }}}


 bindl=,switch:Lid Switch, exec, hyprlock 
