#####################
### LOOK AND FEEL ###
#####################

source = ./theme/01_palette.conf
source = ./theme/01_space.conf
source = ./theme/01_border.conf
source = ./theme/02_semantics.conf

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = $SPACE
    gaps_out = $SPACE_2
    border_size = $BORDER_SIZE

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Matching niri's active gradient: from white to hsl(150 50% 50% / 90%)
    col.active_border = $COLOR_BORDER_START_ACTIVE $COLOR_BORDER_END_ACTIVE 90deg
    col.inactive_border = $COLOR_BORDER_START_INACTIVE $COLOR_BORDER_END_INACTIVE 90deg

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 8
    rounding_power = 8

    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.2
    dim_special = 0.5

    shadow {
        enabled = true  
        range = 2  
        render_power = 2
        offset = $SHADOW_OFFSET
        sharp = true
        color = rgba(0,0,0,0.5)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations

# Animationtree {{{
# global
#   ↳ windows - styles: slide, popin, gnomed
#     ↳ windowsIn - window open - styles: same as windows
#     ↳ windowsOut - window close - styles: same as windows
#     ↳ windowsMove - everything in between, moving, dragging, resizing.
#   ↳ layers - styles: slide, popin, fade
#     ↳ layersIn - layer open
#     ↳ layersOut - layer close
#   ↳ fade
#     ↳ fadeIn - fade in for window open
#     ↳ fadeOut - fade out for window close
#     ↳ fadeSwitch - fade on changing activewindow and its opacity
#     ↳ fadeShadow - fade on changing activewindow for shadows
#     ↳ fadeDim - the easing of the dimming of inactive windows
#     ↳ fadeLayers - for controlling fade on layers
#       ↳ fadeLayersIn - fade in for layer open
#       ↳ fadeLayersOut - fade out for layer close
#     ↳ fadePopups - for controlling fade on wayland popups
#       ↳ fadePopupsIn - fade in for wayland popup open
#       ↳ fadePopupsOut - fade out for wayland popup close
#     ↳ fadeDpms - for controlling fade when dpms is toggled
#   ↳ border - for animating the border's color switch speed
#   ↳ borderangle - for animating the border's gradient angle - styles: once (default), loop
#   ↳ workspaces - styles: slide, slidevert, fade, slidefade, slidefadevert
#     ↳ workspacesIn - styles: same as workspaces
#     ↳ workspacesOut - styles: same as workspaces
#     ↳ specialWorkspace - styles: same as workspaces
#       ↳ specialWorkspaceIn - styles: same as workspaces
#       ↳ specialWorkspaceOut - styles: same as workspaces
#   ↳ zoomFactor - animates the screen zoom
#   ↳ monitorAdded - monitor added zoom animation
#}}}

animations {
    enabled = yes

    bezier = easeOutExpo,    0.16, 1,    0.3,  1  # For window-open
    bezier = easeOutQuad,    0.25, 0.46, 0.45, 0.94  # For window-close
    
    # Animations matching niri's config
    # workspace-switch: off in niri
    animation = workspaces, 1, 0.5, default, slidefadevert
    animation = specialWorkspaceIn, 1, 1.5, default, slidefadevert
    animation = specialWorkspaceOut, 1, 2, default, slidefadevert
    
    animation = windows, 1, 1, default
    animation = windowsIn, 1, 2, easeOutExpo, slide 20%
    animation = windowsOut, 1, 1, easeOutQuad, slide 20%
    animation = border, 1, 2, default
    animation = fade, 1, 2, default
    animation = layers, 1, 2, default
}


# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

